<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Rapport d'Activité DREAL</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- API Grist -->
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

    <style>
        /* Animation de la carte d'introduction */
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-up {
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.5s;
        }

        /* Animation de déploiement quasi full-screen (passée à 3 secondes) */
        @keyframes growBranchFullScreen {
            0% {
                opacity: 0;
                transform: scaleX(0) scaleY(0.3) rotate(-4deg);
                transform-origin: left center;
            }
            60% {
                opacity: 0.9;
                transform: scaleX(1.02) scaleY(1.02) rotate(1deg);
                transform-origin: left center;
            }
            100% {
                opacity: 1;
                transform: scaleX(1) scaleY(1) rotate(0deg);
                transform-origin: left center;
            }
        }

        .animate-branch-fullscreen {
            animation: growBranchFullScreen 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen overflow-x-hidden">

    <div id="app">
        <div class="text-center py-24 text-slate-400">Chargement de l'application...</div>
    </div>

    <script>
        let currentView = 'home';
        let currentThemeId = null;
        let currentThemeName = null;
        let currentThemeIntro = null;
        let currentThemeImage = null;
        let currentThemeAnimSvg = null;
        let thematiquesRecords = [];
        let articlesTableData = null;

        const BASE_IMG_URL = "http://webissimo.developpement-durable.gouv.fr/IMG/";
        const DEFAULT_HERO_IMAGE = "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=80";

        function buildFullUrl(suffix) {
            if (!suffix || typeof suffix !== 'string') return null;
            const cleanSuffix = suffix.trim();
            if (cleanSuffix === '') return null;
            if (cleanSuffix.startsWith('http://') || cleanSuffix.startsWith('https://')) {
                return cleanSuffix;
            }
            return BASE_IMG_URL + cleanSuffix.replace(/^\//, '');
        }

        grist.ready();

        grist.onRecords(function(records) {
            thematiquesRecords = Array.isArray(records) ? records : [];
            loadArticles();
        });

        async function loadArticles() {
            try {
                if (window.grist && grist.docApi) {
                    articlesTableData = await grist.docApi.fetchTable('Articles');
                }
            } catch (e) {
                console.warn("Erreur chargement articles :", e);
                articlesTableData = null;
            }
            render();
        }

        function getCleanArticles() {
            if (!articlesTableData) return [];

            const keys = Object.keys(articlesTableData);
            const titres = articlesTableData.titre || articlesTableData.Titre || [];
            const textes = articlesTableData.texte || articlesTableData.Texte || [];
            
            const chiffreKey = keys.find(k => k.toLowerCase() === 'indicateur_chiffre') || null;
            const suffixeKey = keys.find(k => k.toLowerCase() === 'indicateur_suffixe') || null;
            const texteIndKey = keys.find(k => k.toLowerCase() === 'indicateur_texte') || null;

            const chiffres = chiffreKey ? articlesTableData[chiffreKey] : (articlesTableData.indicateur_chiffre || []);
            const suffixes = suffixeKey ? articlesTableData[suffixeKey] : (articlesTableData.indicateur_suffixe || []);
            const textesInd = texteIndKey ? articlesTableData[texteIndKey] : (articlesTableData.indicateur_texte || []);

            const img1Key = keys.find(k => k.toLowerCase() === 'image_1') || null;
            const img2Key = keys.find(k => k.toLowerCase() === 'image_2') || null;
            
            const images1 = img1Key ? articlesTableData[img1Key] : (articlesTableData.image_1 || []);
            const images2 = img2Key ? articlesTableData[img2Key] : (articlesTableData.image_2 || []);

            const thematiqueKey = keys.find(k => k.toLowerCase().includes('thematique') || k.toLowerCase().includes('thème')) || null;
            const thematiques = thematiqueKey ? articlesTableData[thematiqueKey] : [];

            const colorKey = keys.find(k => k.toLowerCase().includes('couleur') || k.toLowerCase().includes('color') || k.toLowerCase().includes('fond')) || null;
            const couleurs = colorKey ? articlesTableData[colorKey] : [];

            let articles = [];
            const maxLength = Math.max(titres.length, textes.length, 0);

            for (let i = 0; i < maxLength; i++) {
                let img1Url = buildFullUrl(images1[i]);
                let img2Url = buildFullUrl(images2[i]);

                let bgColor = couleurs[i] || '#ffffff';
                if (typeof bgColor !== 'string' || !bgColor.startsWith('#')) {
                    bgColor = '#ffffff';
                }

                let articleTheme = thematiques[i];
                let articleThemeId = null;
                let articleThemeName = '';
                if (Array.isArray(articleTheme)) {
                    articleThemeId = articleTheme[0];
                    articleThemeName = String(articleTheme[1] || '');
                } else if (typeof articleTheme === 'number') {
                    articleThemeId = articleTheme;
                } else if (typeof articleTheme === 'string') {
                    articleThemeName = articleTheme;
                }

                articles.push({
                    titre: titres[i] || 'Sans titre',
                    texte: textes[i] || '',
                    chiffre: chiffres[i] !== undefined && chiffres[i] !== null ? chiffres[i] : null,
                    suffixe: suffixes[i] || '',
                    texteInd: textesInd[i] || '',
                    imageUrl1: img1Url,
                    imageUrl2: img2Url,
                    bgColor: bgColor,
                    themeId: articleThemeId,
                    themeName: articleThemeName
                });
            }

            return articles.filter(article => {
                if (currentThemeId && article.themeId === currentThemeId) return true;
                if (currentThemeName && article.themeName.toLowerCase().trim() === currentThemeName.toLowerCase().trim()) return true;
                return false;
            });
        }

        function parseMarkdown(md) {
            if (!md) return '';
            return String(md)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/^# (.*$)/gm, '<h3 class="text-xl font-bold text-slate-900 mt-6 mb-3">$1</h3>')
                .replace(/^## (.*$)/gm, '<h4 class="text-lg font-bold text-slate-900 mt-4 mb-2">$2</h4>')
                .replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-900">$1</strong>')
                .replace(/\*(.*?)\*/g, '<em class="italic">$1</em>')
                .replace(/\n/g, '<br>');
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            if (currentView === 'home') {
                let html = `
                    <header class="relative bg-slate-900 text-white min-h-[65vh] flex flex-col justify-between overflow-hidden pb-12">
                        <img src="${DEFAULT_HERO_IMAGE}" alt="DREAL Occitanie" class="absolute inset-0 w-full h-full object-cover opacity-60">
                        <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-transparent to-slate-950/90"></div>
                        
                        <div class="relative z-10 max-w-6xl mx-auto w-full p-8 pt-12">
                            <span class="inline-block px-4 py-1.5 rounded-full bg-white/20 backdrop-blur-md text-xs font-semibold uppercase tracking-wider mb-4 border border-white/30">
                                DREAL Occitanie
                            </span>
                            <h1 class="text-4xl md:text-6xl font-black tracking-tight leading-none text-white drop-shadow-md max-w-3xl">
                                Rapport d'Activité
                            </h1>
                        </div>

                        <div class="relative z-10 max-w-6xl mx-auto w-full px-8 pb-4">
                            <div class="bg-white/10 backdrop-blur-md border border-white/20 p-6 md:p-8 rounded-3xl max-w-4xl shadow-2xl space-y-4">
                                <h2 class="text-xs font-bold uppercase tracking-widest text-emerald-300">Éditorial</h2>
                                <div class="text-sm md:text-base text-slate-100 font-light leading-relaxed space-y-3">
                                    <p>
                                        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nullam non lacus et diam malesuada malesuada. Suspendisse tincidunt mauris sit amet est sodales, eu aliquam quam maximus. Sed pulvinar, magna eu auctor eleifend, augue urna bibendum augue, eu aliquet quam ipsum quis velit. Phasellus ipsum magna, lobortis eu facilisis dignissim, egestas ac tortor. Sed at elit purus. Nunc tincidunt ex velit, eget consequat lacus sodales vitae. Proin vel facilisis libero.
                                    </p>
                                    <p>
                                        Nam tortor est, pulvinar quis sapien nec, faucibus ullamcorper velit. Fusce pellentesque tellus efficitur finibus rhoncus. Sed et lacus purus. In sed mattis nunc, vitae vulputate est. Nam mi diam, finibus sed laoreet in, mattis quis libero. Praesent efficitur placerat luctus. Ut et nisl ultrices, ullamcorper purus ut, consectetur lectus. Vivamus faucibus mi nec nunc congue, a egestas tortor rhoncus. Morbi volutpat sollicitudin lectus, vitae tempor orci posuere vel. Morbi varius urna ac felis malesuada accumsan. Etiam accumsan dui erat, hendrerit iaculis nisl fringilla in. Aenean congue faucibus ante, sed vestibulum magna finibus ac. Phasellus ante tellus, scelerisque quis porttitor at, tincidunt ac est. Aliquam eu lorem nunc. Duis fermentum quam vel ligula sollicitudin, at efficitur ipsum vulputate.
                                    </p>
                                    <p>
                                        Orci varius natoque penatibus et magnis dis parturient montes, nascetur ridiculus mus. Vestibulum imperdiet massa dolor, interdum aliquam arcu posuere a. Curabitur commodo, ante eget pharetra pulvinar, velit tortor pellentesque dolor, vitae fermentum enim massa quis enim. Aenean placerat metus id nulla placerat volutpat. Suspendisse quis placerat erat. Vestibulum ac vehicula ex. Nam congue risus at leo vulputate, auctor laoreet sem auctor. Fusce rhoncus, mauris a venenatis pulvinar, augue felis lobortis nunc, quis ultricies tortor enim quis lorem. Nunc nec enim magna.
                                    </p>
                                    <p>
                                        In sit amet enim lacus. Proin fermentum, velit at viverra molestie, nisl lectus consectetur metus, sed blandit enim dolor eu lectus. Vivamus bibendum ullamcorper enim, non vulputate leo congue eu. Aenean fringilla sollicitudin dui sed mattis. Mauris iaculis tempus leo, et laoreet metus tristique ac. Praesent est turpis, faucibus et dolor at, aliquam fermentum tortor. Ut sed augue nulla. In hac habitasse platea dictumst. Sed augue leo, convallis a massa eu, dapibus tincidunt sem. Pellentesque ligula orci, tincidunt at commodo et, lacinia non risus. Vestibulum blandit efficitur sem ut ullamcorper. Quisque dolor nulla, gravida at elementum quis, lacinia ut quam.
                                    </p>
                                </div>
                                <div class="pt-3 border-t border-white/15 text-right">
                                    <span class="text-xs font-bold uppercase tracking-wider text-emerald-200">La Directrice régionale</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main class="max-w-6xl mx-auto px-8 py-16">
                        <div class="mb-8">
                            <h2 class="text-2xl font-bold text-slate-900">Explorer par thématiques</h2>
                            <p class="text-slate-500 text-sm">Sélectionnez un domaine pour consulter les articles dédiés</p>
                        </div>
                `;

                if (!thematiquesRecords || thematiquesRecords.length === 0) {
                    html += `
                        <div class="bg-amber-50 border border-amber-200 text-amber-800 p-6 rounded-2xl text-center">
                            <strong>Aucune thématique transmise par Grist.</strong> Vérifie la liaison dans le panneau de droite.
                        </div>`;
                } else {
                    html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;

                    thematiquesRecords.forEach((theme) => {
                        const keys = Object.keys(theme);
                        const nomKey = keys.find(k => k.toLowerCase().includes('nom') || k.toLowerCase().includes('titre')) || keys[1] || 'nom';
                        const nom = theme[nomKey] || theme.nom || theme.Nom || 'Sans nom';
                        const description = theme.description_courte || theme.Description_courte || '';
                        
                        const introKey = keys.find(k => k.toLowerCase().includes('intro')) || null;
                        const introduction = introKey ? theme[introKey] : description;

                        const themeImgSuffix = theme.image_theme || theme.Image_theme || null;
                        const animSvgSuffix = theme.animation || theme.Animation || null;

                        let themeImg = buildFullUrl(themeImgSuffix) || DEFAULT_HERO_IMAGE;
                        let animSvg = buildFullUrl(animSvgSuffix);

                        const themeId = theme.id || 1;

                        html += `
                            <a href="#" data-id="${themeId}" data-name="${String(nom).replace(/"/g, '&quot;')}" data-intro="${String(introduction).replace(/"/g, '&quot;')}" data-img="${themeImg}" data-anim="${animSvg || ''}" class="theme-link relative h-80 rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 group block text-left no-underline cursor-pointer hover:-translate-y-1">
                                <img src="${themeImg}" alt="${nom}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/40 to-transparent"></div>
                                
                                <div class="relative z-10 h-full p-6 flex flex-col justify-end text-white">
                                    <h3 class="text-2xl font-bold mb-2 leading-tight">${nom}</h3>
                                    <p class="text-slate-200 text-xs leading-relaxed line-clamp-2 mb-4 font-light">${description}</p>
                                    <span class="inline-flex items-center gap-1 text-emerald-400 font-bold text-xs uppercase tracking-wider">
                                        Explorer &rarr;
                                    </span>
                                </div>
                            </a>
                        `;
                    });

                    html += `</div>`;
                }

                html += `</main>`;
                app.innerHTML = html;

                document.querySelectorAll('.theme-link').forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        const id = parseInt(this.getAttribute('data-id'));
                        const name = this.getAttribute('data-name');
                        const intro = this.getAttribute('data-intro');
                        const img = this.getAttribute('data-img');
                        const anim = this.getAttribute('data-anim');
                        openTheme(id, name, intro, img, anim);
                    });
                });

            } else if (currentView === 'theme') {
                const articlesDuTheme = getCleanArticles();

                let branchAnimationHtml = '';
                if (currentThemeAnimSvg) {
                    branchAnimationHtml = `
                        <div class="w-full flex justify-start my-6 overflow-hidden">
                            <div class="w-[calc(100vw-200px)] max-w-[1800px] pl-4 md:pl-12">
                                <img src="${currentThemeAnimSvg}" alt="Animation branche grand format" class="w-full max-h-[400px] object-contain object-left animate-branch-fullscreen drop-shadow-md">
                            </div>
                        </div>
                    `;
                }

                let html = `
                    <header class="relative bg-slate-900 text-white min-h-[40vh] flex flex-col justify-between overflow-hidden pb-12">
                        <img src="${currentThemeImage}" alt="${currentThemeName}" class="absolute inset-0 w-full h-full object-cover opacity-60">
                        <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-transparent to-slate-950/90"></div>

                        <div class="relative z-10 max-w-6xl mx-auto w-full p-8 pt-8">
                            <a href="#" id="btn-back" class="inline-flex items-center gap-2 text-xs font-semibold text-white bg-white/20 backdrop-blur-md px-4 py-2 rounded-xl border border-white/30 shadow-sm transition hover:bg-white/30 no-underline cursor-pointer mb-6">
                                &larr; Retour à l'accueil
                            </a>
                            <br>
                            <span class="text-xs font-bold uppercase tracking-wider text-emerald-300 bg-emerald-950/60 backdrop-blur-md px-3 py-1 rounded-full border border-emerald-500/30">Thématique</span>
                            <h1 class="text-4xl md:text-6xl font-black text-white mt-3 drop-shadow-md">${currentThemeName}</h1>
                        </div>

                        <div class="absolute bottom-0 left-0 right-0 w-full overflow-hidden leading-none z-10">
                            <svg class="relative block w-full h-12 md:h-16 text-slate-100" viewBox="0 0 1200 120" preserveAspectRatio="none">
                                <path d="M0,0 C150,90 350,-40 500,45 C650,130 900,10 1200,40 L1200,120 L0,120 Z" fill="currentColor"></path>
                            </svg>
                        </div>
                    </header>

                    <div class="relative bg-slate-100 pb-16 pt-2 overflow-hidden">
                        ${branchAnimationHtml}

                        <div class="max-w-4xl w-full mx-auto px-8 relative z-20">
                            <div class="bg-white/80 backdrop-blur-xl border border-white/60 p-8 md:p-10 rounded-3xl shadow-xl animate-slide-up">
                                <h2 class="text-xs font-bold uppercase tracking-widest text-emerald-600 mb-3">Introduction</h2>
                                <div class="text-slate-700 text-base md:text-lg font-light leading-relaxed">
                                    ${parseMarkdown(currentThemeIntro) || "Découvrez l'ensemble des travaux, données et faits marquants de cette thématique."}
                                </div>
                            </div>
                        </div>
                    </div>

                    <main class="w-full space-y-0">
                `;

                if (articlesDuTheme.length === 0) {
                    html += `<div class="max-w-4xl mx-auto my-12 p-8 bg-white rounded-3xl text-center text-slate-400 border border-slate-100 shadow-sm">Aucun article n'est encore rattaché à cette thématique.</div>`;
                } else {
                    articlesDuTheme.forEach(article => {
                        let kpiHtml = '';
                        if (article.chiffre !== null && article.chiffre !== '') {
                            // Fond blanc fixe à 50% d'opacité
                            kpiHtml = `
                                <div class="float-left mr-8 mb-4 border border-black/10 rounded-3xl p-6 shadow-sm max-w-xs flex flex-col justify-center" style="background-color: rgba(255, 255, 255, 0.5); backdrop-filter: blur(8px);">
                                    <div class="font-black text-4xl md:text-5xl tracking-tight text-slate-900 leading-none">
                                        ${article.chiffre} <span class="text-xl md:text-2xl font-bold text-slate-700">${article.suffixe}</span>
                                    </div>
                                    ${article.texteInd ? `<div class="text-sm md:text-base text-slate-800 font-semibold mt-3 leading-snug border-t border-black/10 pt-2">${article.texteInd}</div>` : ''}
                                </div>
                            `;
                        }

                        let image1Html = article.imageUrl1 ? `
                            <img src="${article.imageUrl1}" alt="${article.titre}" class="rounded-2xl max-h-[500px] w-full object-cover mb-6 shadow-sm border border-slate-100">
                        ` : '';

                        let image2Html = article.imageUrl2 ? `
                            <img src="${article.imageUrl2}" alt="${article.titre} - illustration complémentaire" class="rounded-2xl max-h-[500px] w-full object-cover mt-6 mb-6 shadow-sm border border-slate-100">
                        ` : '';

                        const formattedText = parseMarkdown(article.texte);

                        html += `
                            <section class="w-full py-16 px-8 border-b border-slate-200/40" style="background-color: ${article.bgColor};">
                                <div class="max-w-4xl mx-auto">
                                    <h2 class="text-3xl font-extrabold text-slate-900 mb-6 tracking-tight">${article.titre}</h2>
                                    ${image1Html}
                                    <div class="clearfix">
                                        ${kpiHtml}
                                        <div class="text-slate-700 text-lg leading-relaxed space-y-4">${formattedText}</div>
                                    </div>
                                    ${image2Html}
                                </div>
                            </section>
                        `;
                    });
                }

                html += `</main>`;
                app.innerHTML = html;

                const btnBack = document.getElementById('btn-back');
                if (btnBack) {
                    btnBack.addEventListener('click', function(e) {
                        e.preventDefault();
                        goHome();
                    });
                }
            }
        }

        function openTheme(id, name, intro, img, anim) {
            currentThemeId = id;
            currentThemeName = name;
            currentThemeIntro = intro;
            currentThemeImage = img;
            currentThemeAnimSvg = anim;
            currentView = 'theme';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goHome() {
            currentView = 'home';
            currentThemeId = null;
            currentThemeName = null;
            currentThemeIntro = null;
            currentThemeImage = null;
            currentThemeAnimSvg = null;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
